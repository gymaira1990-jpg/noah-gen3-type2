<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模型库 · 诺亚核心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh}
.nav{background:#161b22;padding:10px 20px;display:flex;align-items:center;gap:20px;border-bottom:1px solid #30363d;position:sticky;top:0;z-index:100}
.nav a{color:#8b949e;text-decoration:none;font-size:13px;padding:4px 10px;border-radius:4px}
.nav a:hover,.nav a.active{color:#58a6ff;background:#1c2333}
.nav .title{font-size:15px;font-weight:600;color:#e6edf3}
.container{max-width:1200px;margin:0 auto;padding:20px}

.section{margin-bottom:24px}
.section h2{font-size:16px;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid #30363d}
.section h2 .badge{font-size:11px;background:#21262d;color:#8b949e;padding:2px 8px;border-radius:10px;margin-left:8px;font-weight:400}

.model-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.model-card{background:#161b22;border-radius:4px;padding:14px;border:1px solid #30363d;transition:border-color .15s}
.model-card:hover{border-color:#58a6ff}
.model-card h3{font-size:14px;margin-bottom:3px;color:#e6edf3}
.model-card .meta{font-size:11px;color:#8b949e;margin-bottom:6px}
.model-card .params{display:flex;gap:8px;font-size:11px;color:#8b949e}
.model-card .params span{padding:2px 6px;background:#0d1117;border:1px solid #21262d;border-radius:4px}

.badge-local{color:#3fb950;font-size:10px;background:#132b1a;padding:2px 6px;border-radius:4px}
.badge-cloud{color:#58a6ff;font-size:10px;background:#1c2333;padding:2px 6px;border-radius:4px}
.badge-chat{color:#d29922;font-size:10px;background:#2d2107;padding:2px 6px;border-radius:4px}
.badge-func{color:#8957e5;font-size:10px;background:#1e1333;padding:2px 6px;border-radius:4px}

.btn{background:#1f6feb;color:#fff;border:none;padding:5px 12px;border-radius:4px;cursor:pointer;font-size:12px}
.btn:hover{background:#388bfd}
.btn-sm{font-size:11px;padding:3px 8px}
.loading{text-align:center;padding:40px;color:#484f58;font-size:13px}
</style>
</head>
<body>
<nav class="nav">
  <span class="title">⚡ 诺亚核心</span>
  <a href="/dashboard">仪表盘</a>
  <a href="/models" class="active">模型库</a>
  <a href="/chat/deepseek">🤖 DeepSeek</a>
  <a href="/chat/4b">🖥️ 4B</a>
</nav>
<div class="container" id="app">
  <div class="loading">加载模型库...</div>
</div>

<script>
async function loadModels() {
  try {
    const res = await fetch('/api/models/library').then(r => r.json());
    render(res);
  } catch(e) {
    document.getElementById('app').innerHTML = `<div class="loading" style="color:#f85149">🔴 加载失败: ${e.message}</div>`;
  }
}

function render(data) {
  const sections = [];

  if (data.chat && data.chat.local && data.chat.local.length) {
    sections.push(renderSection('💬 对话模型 · 本地', data.chat.local, 'local', 'chat'));
  }
  if (data.chat && data.chat.cloud && data.chat.cloud.length) {
    sections.push(renderSection('☁️ 对话模型 · 云端', data.chat.cloud, 'cloud', 'chat'));
  }
  if (data.function && data.function.local && data.function.local.length) {
    sections.push(renderSection('🔧 功能模型 · 本地 (嵌入/排序/视觉)', data.function.local, 'local', 'func'));
  }
  if (data.function && data.function.cloud && data.function.cloud.length) {
    sections.push(renderSection('🔧 功能模型 · 云端 (嵌入/排序/视觉)', data.function.cloud, 'cloud', 'func'));
  }

  document.getElementById('app').innerHTML = sections.join('') || '<div class="loading">暂无模型</div>';
}

function renderSection(title, models, type, category) {
  const total = models.length;
  return `
    <div class="section">
      <h2>${title} <span class="badge">${total} 个</span></h2>
      <div class="model-grid">
        ${models.map(m => `
          <div class="model-card">
            <h3>${m.name}</h3>
            <div class="meta">${m.real_name || m.model_id || ''}</div>
            <div style="display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap">
              <span class="badge-${type}">${type === 'local' ? '本地' : '云端'}</span>
              <span class="badge-${category}">${category === 'chat' ? '对话' : '功能'}</span>
              <span style="font-size:10px;color:#484f58;background:#0d1117;padding:2px 6px;border-radius:4px">${m.provider}</span>
            </div>
            <div class="params">
              <span>🌡️ ${m.temperature ?? 0.7}</span>
              <span>📐 ${m.max_tokens ?? 4096}</span>
            </div>
            ${m.description ? `<div style="font-size:11px;color:#8b949e;margin-top:6px">${m.description}</div>` : ''}
            ${m.notes ? `<div style="font-size:10px;color:#484f58;margin-top:3px">📝 ${m.notes}</div>` : ''}
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

loadModels();
</script>
</body>
</html>
