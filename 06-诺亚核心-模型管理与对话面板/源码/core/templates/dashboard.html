<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仪表盘 · 诺亚核心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh}
.nav{background:#161b22;padding:10px 20px;display:flex;align-items:center;gap:20px;border-bottom:1px solid #30363d;position:sticky;top:0;z-index:100;flex-wrap:wrap}
.nav a{color:#8b949e;text-decoration:none;font-size:13px;padding:4px 10px;border-radius:4px;transition:color .15s,background .15s}
.nav a:hover,.nav a.active{color:#58a6ff;background:#1c2333}
.nav .title{font-size:15px;font-weight:600;color:#e6edf3;margin-right:8px}

/* ─── 容器 ─── */
.container{max-width:1400px;margin:0 auto;padding:20px}

/* ─── 第一行：四宫格 ─── */
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:12px}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:768px){.row-2{grid-template-columns:1fr}}

/* ─── 通用卡片 ─── */
.card{background:#161b22;border-radius:4px;padding:16px;border:1px solid #30363d;transition:border-color .15s}
.card:hover{border-color:#58a6ff}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.card-title{font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.4px;font-weight:500}

/* ─── 数值 ─── */
.val-lg{font-size:22px;font-weight:700}
.val-num{font-variant-numeric:tabular-nums}
.val-green{color:#3fb950}
.val-red{color:#f85149}
.val-yellow{color:#d29922}
.val-blue{color:#58a6ff}
.val-muted{color:#484f58;font-size:11px;margin-top:2px}

/* ─── 进度条 ─── */
.bar-wrap{height:6px;background:#21262d;border-radius:3px;overflow:hidden;margin:8px 0 4px}
.bar-fill{height:100%;border-radius:3px;transition:width .6s ease,background .3s}
.bar-green .bar-fill{background:#3fb950}
.bar-yellow .bar-fill{background:#d29922}
.bar-red .bar-fill{background:#f85149}
.bar-blue .bar-fill{background:#58a6ff}

.bar-label{display:flex;justify-content:space-between;font-size:11px;color:#8b949e}
.bar-label .num{color:#e6edf3;font-variant-numeric:tabular-nums}

/* ─── 微标签 ─── */
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:4px;margin:1px}
.badge-green{background:#132b1a;color:#3fb950;border:1px solid #1b4426}
.badge-red{background:#2d1215;color:#f85149;border:1px solid #44161a}
.badge-blue{background:#1c2333;color:#58a6ff;border:1px solid #243351}
.badge-yellow{background:#2d2107;color:#d29922;border:1px solid #442f0e}

/* ─── 详情项 ─── */
.detail-item{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #21262d;font-size:12px}
.detail-item:last-child{border-bottom:none}
.detail-label{color:#8b949e}
.detail-value{color:#e6edf3}

/* ─── 模型表 ─── */
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:6px 8px;color:#8b949e;border-bottom:1px solid #30363d;font-weight:500}
td{padding:6px 8px;border-bottom:1px solid #21262d;font-size:12px}
.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle}
.status-dot.online{background:#3fb950}
.status-dot.offline{background:#f85149}

/* ─── 服务卡片 ─── */
.svc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.svc-card{padding:10px 12px;background:#0d1117;border:1px solid #21262d;border-radius:4px;font-size:12px}
.svc-card .svc-name{font-weight:500;color:#e6edf3}
.svc-card .svc-port{color:#484f58;font-size:10px;margin-left:4px}
.svc-card .svc-vision{color:#58a6ff;font-size:10px;margin-left:4px}

.svc-card.active{border-color:#1b4426}
.svc-card.stopped{border-color:#21262d}
.svc-card.stopped .svc-name{color:#484f58}

/* ─── 加载/错误 ─── */
.loading{text-align:center;padding:60px;color:#484f58;font-size:14px}
.error{color:#f85149;padding:40px;text-align:center}
.mt-2{margin-top:16px}
</style>
</head>
<body>
<nav class="nav">
  <span class="title">⚡ 诺亚核心</span>
  <a href="/dashboard" class="active">仪表盘</a>
  <a href="/models">模型库</a>
  <a href="/chat/deepseek">🤖 DeepSeek</a>
  <a href="/chat/4b">🖥️ 4B</a>
</nav>
<div class="container" id="app">
  <div class="loading">⏳ 加载仪表盘...</div>
</div>

<script>
// ─── 工具函数 ───
function pctBar(pct, label, colorMap) {
  const c = colorMap || ((p) => p > 85 ? 'red' : p > 60 ? 'yellow' : 'green');
  const cls = c(pct);
  return `<div class="bar-wrap bar-${cls}"><div class="bar-fill" style="width:${Math.min(pct,100)}%"></div></div><div class="bar-label"><span>${label}</span><span class="num">${pct}%</span></div>`;
}

function pctColor(p) {
  return p > 85 ? 'red' : p > 60 ? 'yellow' : 'green';
}

function fmtNum(n) {
  if (n == null || n === '?') return '?';
  const v = parseInt(n);
  if (isNaN(v)) return n;
  return v.toLocaleString();
}

// ─── 主渲染 ───
async function loadData() {
  const app = document.getElementById('app');
  try {
    const [sys, check, services] = await Promise.all([
      fetch('/api/system').then(r=>r.json()),
      fetch('/api/check').then(r=>r.json()),
      fetch('/api/services').then(r=>r.json())
    ]);
    render(app, sys, check, services);
  } catch(e) {
    app.innerHTML = `<div class="error">🔴 加载失败: ${e.message}</div>`;
  }
}

function render(app, sys, check, services) {
  const mem = sys.memory || {};
  const cpu = sys.cpu || {};
  const disk = sys.disk || {};
  const gpu = sys.gpu || [];
  const swap = sys.swap || {};
  const online = check.online || 0;
  const offline = check.offline || 0;
  const total = check.total || 0;

  // 进度条颜色辅助
  const memPct = mem.pct_num || 0;
  const diskPct = disk.use_pct_num || 0;

  app.innerHTML = `

    <!-- ═══ 第一行 · 四宫格 ═══ -->
    <div class="row">

      <!-- 模型状态 -->
      <div class="card">
        <div class="card-header"><span class="card-title">🤖 模型状态</span></div>
        <div class="val-lg val-${online > 0 ? 'green' : 'red'}">${online} / ${total}</div>
        <div class="val-muted">🟢 ${online} 在线 · 🔴 ${offline} 离线 · 共 ${total} 个</div>
        <div style="display:flex;gap:4px;margin-top:8px;flex-wrap:wrap">
          ${(check.models || []).slice(0,6).map(m =>
            `<span class="badge badge-${m.online ? 'green' : 'red'}">${m.online ? '🟢' : '🔴'} ${m.name}</span>`
          ).join('')}
          ${(check.models || []).length > 6 ? `<span class="badge badge-blue">+${(check.models||[]).length - 6}</span>` : ''}
        </div>
      </div>

      <!-- 内存 -->
      <div class="card">
        <div class="card-header"><span class="card-title">💾 内存</span></div>
        <div class="val-lg val-${pctColor(memPct)}">${fmtNum(mem.used)} MB</div>
        <div class="val-muted">共 ${fmtNum(mem.total)} MB · 空闲 ${fmtNum(mem.free)} MB</div>
        ${pctBar(memPct, '已用', null)}
      </div>

      <!-- CPU -->
      <div class="card">
        <div class="card-header"><span class="card-title">🖥️ CPU</span></div>
        <div class="val-lg val-blue">${cpu.cores || '?'} 核</div>
        <div class="val-muted">主机: ${sys.hostname || '-'}</div>
        <div style="margin-top:10px">
          ${(() => {
            const loads = cpu.load || ['?','?','?'];
            const colors = loads.map(l => {
              const v = parseFloat(l);
              if (isNaN(v)) return 'muted';
              const perCore = cpu.cores ? v / parseInt(cpu.cores) * 100 : 0;
              return perCore > 70 ? 'red' : perCore > 40 ? 'yellow' : 'green';
            });
            const labels = ['1分','5分','15分'];
            return loads.map((l,i) =>
              `<span class="badge badge-${colors[i]}" style="margin-right:4px">${labels[i]} ${l}</span>`
            ).join('');
          })()}
        </div>
      </div>

      <!-- 磁盘 -->
      <div class="card">
        <div class="card-header"><span class="card-title">💿 磁盘</span></div>
        <div class="val-lg val-${pctColor(diskPct)}">${disk.use_pct || '?'}</div>
        <div class="val-muted">${disk.used || '?'} / ${disk.total || '?'} · 可用 ${disk.avail || '?'}</div>
        ${pctBar(diskPct, '已用', null)}
      </div>
    </div>

    <!-- ═══ 第二行 · GPU + 系统信息 ═══ -->
    <div class="row-2">

      <!-- GPU -->
      <div class="card">
        <div class="card-header"><span class="card-title">🎮 GPU</span></div>
        ${gpu.length ? gpu.map(g => `
          <div style="margin-bottom:8px">
            <div style="font-size:13px;font-weight:500;margin-bottom:2px">${g.name}</div>
            <div class="detail-item">
              <span class="detail-label">🌡️ 温度</span>
              <span class="detail-value">${g.temp || '?'}°C</span>
            </div>
            <div style="margin-top:6px">
              <div style="font-size:10px;color:#8b949e;margin-bottom:2px">VRAM 显存</div>
              <div class="bar-wrap bar-${pctColor(g.vram_pct)}"><div class="bar-fill" style="width:${Math.min(g.vram_pct,100)}%"></div></div>
              <div class="bar-label"><span>${fmtNum(g.vram_used)} MiB / ${fmtNum(g.vram_total)} MiB</span><span class="num">${g.vram_pct}%</span></div>
            </div>
            <div style="margin-top:6px">
              <div style="font-size:10px;color:#8b949e;margin-bottom:2px">利用率</div>
              <div class="bar-wrap bar-${pctColor(g.util)}"><div class="bar-fill" style="width:${Math.min(g.util,100)}%"></div></div>
              <div class="bar-label"><span>GPU 负载</span><span class="num">${g.util}%</span></div>
            </div>
          </div>
        `).join('') : '<div class="val-muted">未检测到 GPU</div>'}
      </div>

      <!-- 系统信息 -->
      <div class="card">
        <div class="card-header"><span class="card-title">⏱️ 系统信息</span></div>
        <div class="detail-item"><span class="detail-label">主机名</span><span class="detail-value">${sys.hostname || '?'}</span></div>
        <div class="detail-item"><span class="detail-label">运行时间</span><span class="detail-value val-green">${sys.uptime || '?'}</span></div>
        <div class="detail-item"><span class="detail-label">进程数</span><span class="detail-value">${fmtNum(sys.processes)}</span></div>
        <div class="detail-item" style="border-bottom:none;padding-bottom:0">
          <span class="detail-label">Swap</span>
          <span class="detail-value">${fmtNum(swap.used)} / ${fmtNum(swap.total)} MB</span>
        </div>
        ${swap.pct_num > 0 ? `
          <div style="margin-top:6px">
            ${pctBar(swap.pct_num, 'Swap 已用', null)}
          </div>
        ` : ''}
      </div>
    </div>

    <!-- ═══ 第三行 · 本地服务 ═══ -->
    <div class="card" style="margin-bottom:12px">
      <div class="card-header"><span class="card-title">🛠️ 本地服务</span></div>
      <div class="svc-grid">
        ${services.map(s => `
          <div class="svc-card ${s.active ? 'active' : 'stopped'}">
            <div>
              <span class="svc-name">${s.active ? '🟢' : '🔴'} ${s.name}</span>
              ${s.has_mmproj ? '<span class="svc-vision">👁️ Vision</span>' : ''}
            </div>
            <div style="font-size:10px;color:#484f58;margin-top:2px">
              ${s.active ? `端口 ${s.port} · ${s.service}` : '已停止'}
            </div>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- ═══ 第四行 · 模型详情 ═══ -->
    <div class="card">
      <div class="card-header"><span class="card-title">📋 模型详情</span></div>
      <table>
        <thead><tr>
          <th>状态</th><th>名称</th><th>MOD 名</th><th>提供商</th><th>类型</th><th>延迟</th><th>描述</th>
        </tr></thead>
        <tbody>
          ${(check.models || []).map(m => `
            <tr>
              <td><span class="status-dot ${m.online ? 'online' : 'offline'}"></span>${m.online ? '在线' : '离线'}</td>
              <td><strong>${m.name}</strong></td>
              <td style="color:#8b949e">${m.model_id || '-'}</td>
              <td>${m.provider || '-'}</td>
              <td>${m.type || '-'}</td>
              <td class="val-${m.online ? 'green' : 'muted'}">${m.online ? m.latency_ms.toFixed(0) + 'ms' : '-'}</td>
              <td style="color:#8b949e;font-size:11px">${m.description || '-'}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
