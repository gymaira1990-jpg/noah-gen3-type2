*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0c;color:#c8c8c8;font-family:'Segoe UI',system-ui,sans-serif;height:100vh;display:flex;font-size:16px}
#nav{width:220px;min-width:220px;background:#0e0e14;border-right:1px solid #222;display:flex;flex-direction:column;overflow-y:auto}
#nav h2{font-family:Georgia,serif;color:#c9a84c;font-size:16px;padding:16px 14px 12px;letter-spacing:2px;border-bottom:1px solid #1a1a24}
.ns{color:#555;font-size:11px;text-transform:uppercase;letter-spacing:2px;padding:12px 14px 4px}
.ni{color:#888;text-decoration:none;padding:7px 14px;font-size:13px;border-left:2px solid transparent;cursor:pointer;display:block;transition:.12s}
.ni:hover,.ni.on{color:#c9a84c;border-left-color:#c9a84c;background:#14141a}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}

#top .bdg{color:#c9a84c;font-family:Georgia,serif;font-size:15px}
#content{flex:1;overflow-y:auto;padding:12px 16px}
.pn{background:#111118;border:1px solid #222;border-radius:6px;padding:14px;margin-bottom:12px}
.pn h3{color:#c9a84c;font-family:Georgia,serif;font-size:15px;border-bottom:1px solid #1a1a20;padding-bottom:7px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.pn h3 .rf{font-size:11px;color:#8a7330;cursor:pointer;font-family:'Segoe UI'}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.st{text-align:center;padding:14px 8px;background:#0e0e14;border-radius:4px}
.st .v{font-size:22px;color:#c9a84c;font-family:monospace}
.st .l{font-size:11px;color:#555;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:#8a7330;padding:6px 8px;border-bottom:1px solid #222;font-family:Georgia,serif;font-size:12px}
td{padding:5px 8px;border-bottom:1px solid #0e0e14}
tr:hover{background:#14141a}
input,textarea,select{background:#08080c;border:1px solid #222;color:#bbb;padding:8px 10px;border-radius:4px;font-size:13px;width:100%;font-family:monospace}
input:focus,textarea:focus{border-color:#c9a84c;outline:none}
textarea{resize:vertical;min-height:140px}
button{background:linear-gradient(180deg,#1e1e2a,#111118);border:1px solid #8a7330;color:#c9a84c;padding:8px 16px;border-radius:4px;cursor:pointer;font-family:Georgia,serif;font-size:12px}
button:hover{border-color:#c9a84c}
button.dng{border-color:#a33;color:#a33}
.tag{display:inline-block;padding:2px 6px;border-radius:3px;font-size:10px;margin:1px}
.tg{background:#1a2a1a;color:#4a4}.tr{background:#2a1a1a;color:#a44}.ty{background:#2a2a1a;color:#aa4}.tb{background:#1a1a2a;color:#44a}
.al{padding:8px 12px;border-radius:4px;font-size:11px;margin:4px 0}
.ag{background:#1a2a1a;border:1px solid #2a4a2a;color:#4a4}
.ar{background:#2a1a1a;border:1px solid #4a2a2a;color:#a44}
.ay{background:#2a2a1a;border:1px solid #4a4a2a;color:#aa4}
.arch-box{background:#08080c;border:1px dashed #333;border-radius:5px;padding:16px;font-family:monospace;font-size:12px;line-height:1.8;white-space:pre;color:#aaa}
.arch-box .hl{color:#c9a84c}
.arch-box .dim{color:#555}
.doc-line{display:flex;padding:5px 0;border-bottom:1px solid #0e0e14;font-size:12px}

<div id="main">
  <div id="top"><span class="bdg">◆ 诺亚本体 · 管理员通道</span><span style="color:#555;font-size:10px" id="clk"></span></div>

<script>
let cp=null;
function go(p){cp=p;document.querySelectorAll('.ni').forEach(a=>a.classList.remove('on'));event.target.classList.add('on');load(p)}
async function load(p){
  const c=document.getElementById('content');c.innerHTML='<div class="al ag">加载中...</div>';
  try{
    switch(p){
      case 'arch': arch();break;case 'workflow': workflow();break;case 'brain': brain();break;
       case 'dashboard': await dash();break;case 'terminal': term();break;
       case 'ticketview': ticketview();break;case 'llmconfig': llmconfig();break;
       case 'tickets': await tickets();break;case 'memory': await memory();break;
      case 'api': api();break;case 'tools': await tools();break;
      case 'config': await config();break;case 'configdoc': configdoc();break;
      case 'persona': persona();break;case 'database': await database();break;
      case 'security': security();break;case 'logs': await logs();break;
      case 'system': system();break;case 'health': await health();break;case 'chat': chatPanel();break;case 'settings': settings();break;
    }
  }catch(e){c.innerHTML='<div class="al ar">加载失败: '+e.message+'</div>'}
}

async function dash(){
  const c=document.getElementById('content');
  let stats={tokens:0,calls:0},mem={total_entries:0},tools={total_tools:0};
  try{stats=await(await fetch('/api/public/stats')).json()}catch(e){}
  try{mem=await(await fetch('/api/public/memory')).json()}catch(e){}
  try{tools=await(await fetch('/api/public/tools')).json()}catch(e){}
  c.innerHTML=`<div class="g4">${[['Token',(stats.tokens||0).toLocaleString(),'今日'],['调用',stats.calls||0,'次'],['记忆',mem.total_entries||0,'条'],['工具',tools.total_tools||'—','个']].map(s=>`<div class="st"><div class="v">${s[1]}</div><div class="l">${s[0]} · ${s[2]}</div></div>`).join('')}</div>
<div class="g2"><div class="pn"><h3>🛡️ 自检</h3>${['管道 ◆','模型 3个','PG 12表'].map(x=>`<div class="al ag">✅ ${x} 正常</div>`).join('')}</div><div class="pn"><h3>📊 API</h3><div class="al ag">${stats.cost_estimate||'正常'}</div></div></div>`;
}

function thandle(e){
  const ta=document.getElementById('tarea'),ac=document.getElementById('tac');
  if(e.key==='/'&&ta.value===''){
    ac.style.display='block';ac.innerHTML=CMDS.map(c=>`<div style="padding:4px 8px;cursor:pointer;color:#c9a84c" onclick="document.getElementById('tarea').value='/'+'${c.n} ';document.getElementById('tac').style.display='none';document.getElementById('tarea').focus()">/<b>${c.n}</b><span style="color:#888;margin-left:8px">${c.d}</span></div>`).join('');
    setTimeout(()=>ta.value='/',10);
  }
  if(e.key==='Escape'){ac.style.display='none'}
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();tsend()}
}
document.addEventListener('click',e=>{if(!e.target.closest('#tarea')&&!e.target.closest('#tac'))document.getElementById('tac').style.display='none'});

let tTokens=parseInt(localStorage.getItem('noah_tokens')||'0');
document.addEventListener('DOMContentLoaded',()=>{
  const tt=document.getElementById('ttok');if(tt)tt.textContent=tTokens.toLocaleString();
  const tc=document.getElementById('tcost');if(tc)tc.textContent='¥'+(tTokens*0.000002).toFixed(4);
});
async function tsend(cmd){
  let t=(typeof cmd==='string')?cmd:document.getElementById('tarea').value.trim();if(!t)return;
  document.getElementById('tac').style.display='none';
  if(typeof cmd!=='string')document.getElementById('tarea').value='';
  if(t.startsWith('/')){handleSlash(t);return}
  const d=document.getElementById('tmsg');d.innerHTML+=`<div style="color:#c9a84c;margin:4px 0;font-size:13px">⚙> ${t}</div>`;
  // 显示中断按钮+执行状态
  document.getElementById('tstop').style.display='inline';
  document.getElementById('tstate').textContent='⚙ 执行中';
  document.getElementById('tstate').style.color='#aa4';
  try{
    const r=await(await fetch('/api/admin/terminal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})})).json();
    const reply=r.reply||'...';d.innerHTML+=`<div style="color:#bbb;margin:4px 0 10px;font-size:13px">${mdRender(reply)}</div>`;d.scrollTop=d.scrollHeight;
    if(r.tokens){tTokens+=r.tokens;localStorage.setItem('noah_tokens',tTokens);document.getElementById('ttok').textContent=tTokens.toLocaleString();document.getElementById('tcost').textContent='¥'+(tTokens*0.000002).toFixed(4)}
    document.getElementById('tstate').textContent='◆ 就绪';
    document.getElementById('tstate').style.color='#4a4';
  }catch(e){d.innerHTML+=`<div style="color:#a33">通讯失败</div>`;document.getElementById('tstate').textContent='❌ 失败';document.getElementById('tstate').style.color='#a44'}
  document.getElementById('tstop').style.display='none';
}


// Markdown渲染 (共享)
function mdRender(t){
  if(!t)return'';
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
   .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
   .replace(/\*(.+?)\*/g,'<i>$1</i>')
   .replace(/`([^`]+)`/g,'<code style="background:#1a1a24;padding:1px 4px;border-radius:3px">$1</code>')
   .replace(/\n/g,'<br>');
}

async function handleSlash(cmd){
  const t=cmd.slice(1).split(' ')[0].toLowerCase();
  const d=document.getElementById('tmsg');
  switch(t){
    case 'help':case 'h':case '?':d.innerHTML+=`<div style="color:#c9a84c;margin:4px 0">⚙ /help</div><div style="color:#aaa;margin:4px 0 10px">${CMDS.map(c=>`/<b>${c.n}</b> — ${c.d} ${c.a.length?'(别名: '+c.a.join(', ')+')':''}`).join('<br>')}</div>`;d.scrollTop=d.scrollHeight;break;
    case 'status':case 'st':case 'check':d.innerHTML+=`<div style="color:#c9a84c;margin:4px 0">⚙ /status</div>`;try{const r=await(await fetch('/api/admin/system/health',{method:'POST'})).json();d.innerHTML+=`<pre style="color:#aaa;font-size:11px;margin:4px 0 10px">${JSON.stringify(r,null,2)}</pre>`;d.scrollTop=d.scrollHeight}catch(e){}break;
    case 'backup':case 'bk':d.innerHTML+=`<div style="color:#c9a84c;margin:4px 0">⚙ /backup</div>`;try{const r=await(await fetch('/api/admin/system/backup',{method:'POST'})).json();d.innerHTML+=`<div class="al ag" style="margin:4px 0 10px">${JSON.stringify(r)}</div>`;d.scrollTop=d.scrollHeight}catch(e){}break;
    case 'health':case 'hk':d.innerHTML+=`<div style="color:#c9a84c;margin:4px 0">⚙ /health</div>`;try{const r=await(await fetch('/api/admin/system/health',{method:'POST'})).json();d.innerHTML+=`<pre style="color:#aaa;font-size:11px;margin:4px 0 10px">${JSON.stringify(r,null,2)}</pre>`;d.scrollTop=d.scrollHeight}catch(e){}break;
    case 'sync':d.innerHTML+=`<div style="color:#c9a84c;margin:4px 0">⚙ /sync</div>`;try{const r=await(await fetch('/api/admin/system/sync',{method:'POST'})).json();d.innerHTML+=`<div class="al ag" style="margin:4px 0 10px">${JSON.stringify(r)}</div>`;d.scrollTop=d.scrollHeight}catch(e){}break;
    case 'new':case 'reset':d.innerHTML='';tTokens=0;document.getElementById('ttok').textContent='0';document.getElementById('tcost').textContent='¥0';break;
    default:tsend(cmd);break;
  }
}

async function changePw(){
  const o=document.getElementById('sold').value,n1=document.getElementById('snew').value,n2=document.getElementById('snew2').value;
  if(n1!==n2){document.getElementById('pw-msg').textContent='两次密码不一致';return}
  const r=await(await fetch('/api/admin/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({old_password:o,new_password:n1})})).json();
  document.getElementById('pw-msg').textContent=r.status==='ok'?'✅ 已修改':(r.error||'失败');
}
