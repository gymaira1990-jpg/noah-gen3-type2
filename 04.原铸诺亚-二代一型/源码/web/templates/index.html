<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOAH-PRIME · 原初铸造世界</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <h1>⚙ NOAH-PRIME</h1>
      <span class="header-badge">原初铸造世界</span>
      <span class="status-indicator online" id="statusIndicator">◆ 机魂在线</span>
      <span class="token-counter" id="tokenCounter">今日Token: 0</span>
    </header>

    <div class="chat-messages" id="chatMessages">
      <div class="welcome-message">
        <h2>⚙ 万机之神见证</h2>
        <p>NOAH-PRIME · 原初铸造世界已就绪</p>
        <p style="font-size:0.8em;margin-top:8px;">五阶段圣殿管道 · 12铸造工具 · 5人格滤镜</p>
      </div>
    </div>

    <div class="chat-input-area">
      <textarea id="userInput" placeholder="输入圣典诏令... 诺亚会理解你的跳跃思维" rows="2" autofocus></textarea>
      <button id="sendBtn" class="btn-send">▶ 发送</button>
    </div>

    <div class="chat-status" id="chatStatus">◆ 就绪</div>
  </div>
  <script src="/static/chat.js"></script>
</body>
</html>
